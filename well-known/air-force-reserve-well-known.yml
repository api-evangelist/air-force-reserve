source: >-
  Anonymous HTTPS GETs (browser User-Agent, redirects followed) against every host named in
  apis.yml on 2026-08-30. No OpenAPI servers[] hosts exist for this provider.
description: >-
  Probe record of /.well-known/ discovery documents for the Air Force Reserve web estate.
  Every path missed. www.afrc.af.mil is behind an Akamai edge policy that answers 403
  "Access Denied" to our crawler for EVERY path including the site root, so those rows record
  a refusal, not an absence. www.airforce.com (Air Force Recruiting Service) was fully readable
  and genuinely serves none of these documents. No WellKnown or SecurityTxt pointer is emitted
  in apis.yml because no path returned a real document.
hosts:
  - host: www.afrc.af.mil
    note: >-
      Akamai edge returns 403 "Access Denied" (387-byte HTML) for every path, including "/" and
      "/robots.txt". This is a refusal of our client, not evidence the documents are absent.
    documents:
      - path: /.well-known/security.txt
