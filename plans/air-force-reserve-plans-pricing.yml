description: >-
  The Air Force Reserve publishes no API plans, tiers or pricing of any kind, because it publishes
  no API. AFRC is a United States military command; its public web properties are recruiting and
  public-affairs sites and its member systems (myFSS, Air Force Portal) are credentialed, not
  commercial. This file supersedes a 2026-05-04 bulk-sweep scaffold that asserted a free tier with
  a 1,000-request monthly quota — those numbers were never published by the provider and have been
  removed as fabricated.
